<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { background: #FFFFFF; color: #111; font-family: "Noto Sans Thai", system-ui, sans-serif; }
  .band { background: #FFCC00; height: 168px; display: flex; align-items: center; padding: 0 72px; gap: 48px; }
  .gate { font-size: 120px; font-weight: 800; line-height: 1; }
  .msg { font-size: 38px; font-weight: 700; }
  .steps { margin-left: auto; display: flex; gap: 14px; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 500; }
  .pict { width: 40px; height: 40px; background: #111; color: #FFCC00; display: grid; place-items: center; font-weight: 800; }
  .step.dim { color: #3A3A3A; }
  .step.dim .pict { background: #3A3A3A; color: #FFCC00; }
  .arrow { font-size: 30px; font-weight: 800; }
  main { padding: 64px 72px; display: grid; grid-template-columns: 520px 1fr; gap: 96px; }
  form { display: grid; gap: 18px; }
  label { display: grid; gap: 6px; font-size: 15px; font-weight: 500; }
  input { height: 50px; border: 2px solid #111; padding: 0 14px; font: inherit; font-size: 17px; }
  button { height: 54px; background: #111; color: #FFCC00; border: 0; font: inherit; font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
  .alt { background: #fff; color: #111; border: 2px solid #111; }
  .side { border-left: 2px solid #111; padding-left: 40px; display: grid; align-content: start; gap: 24px; }
  .side a { font-size: 22px; font-weight: 700; color: #111; text-decoration: none; display: flex; justify-content: space-between; border-bottom: 2px solid #111; padding-bottom: 14px; max-width: 520px; }
</style>
</head>
<body>
  <header class="band">
    <div class="gate">3</div>
    <div class="msg">เข้าสู่ระบบ</div>
    <div class="steps">
      <div class="step dim"><span class="pict">1</span>สมัคร</div>
      <div class="step dim"><span class="pict">2</span>ยืนยันอีเมล</div>
      <div class="step"><span class="pict">3</span>เข้าสู่ระบบ</div>
    </div>
  </header>
  <main>
    <form>
      <label>อีเมล<input value="somchai@example.com"></label>
      <label>รหัสผ่าน<input type="password" value="password12"></label>
      <button>เข้าสู่ระบบ <span class="arrow">→</span></button>
      <button class="alt">เข้าสู่ระบบด้วย Google <span class="arrow">→</span></button>
    </form>
    <nav class="side">
      <a href="#">ยังไม่มีบัญชี · สมัครสมาชิก <span>→</span></a>
      <a href="#">ลืมรหัสผ่าน <span>→</span></a>
    </nav>
  </main>
</body>
</html>
