<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { background: #F6F7F9; color: #0F172A; font-family: "Noto Sans Thai", system-ui, sans-serif; display: grid; place-items: center; }
  .card { width: 440px; background: #fff; border-radius: 16px; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06); padding: 40px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: #15803D; margin-bottom: 20px; }
  h1 { font-size: 28px; font-weight: 700; }
  .sub { font-size: 15px; color: #64748B; margin-top: 4px; }
  form { margin-top: 28px; display: grid; gap: 16px; }
  label { display: grid; gap: 6px; font-size: 14px; font-weight: 500; }
  input { height: 46px; border: 1px solid #CBD5E1; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 16px; }
  button { height: 48px; border-radius: 10px; background: #15803D; color: #fff; border: 0; font: inherit; font-size: 16px; font-weight: 600; }
  .alt { background: #fff; color: #0F172A; border: 1px solid #CBD5E1; font-weight: 500; }
  .row { display: flex; justify-content: flex-end; font-size: 14px; }
  a { color: #15803D; font-weight: 500; text-decoration: none; }
  .foot { text-align: center; font-size: 14px; color: #64748B; margin-top: 20px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>เข้าสู่ระบบ</h1>
    <p class="sub">ยินดีต้อนรับกลับสู่ Stock Portfolio</p>
    <form>
      <button class="alt">เข้าสู่ระบบด้วย Google</button>
      <label>อีเมล<input value="somchai@example.com"></label>
      <label>รหัสผ่าน<input type="password" value="password12"></label>
      <div class="row"><a href="#">ลืมรหัสผ่าน?</a></div>
      <button>เข้าสู่ระบบ</button>
    </form>
    <p class="foot">ยังไม่มีบัญชี? <a href="#">สมัครสมาชิก</a></p>
  </div>
</body>
</html>
